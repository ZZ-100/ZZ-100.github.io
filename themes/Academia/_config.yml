favicon: /img/favicon.png
# Change to your profile picture
avatar: /img/profile.png
author: 'Zhen Zhang'
author_bio: 'PhD candidate in Economics. My research focuses on statistical analysis, applied economics and data science.'

since: 2026

# Top Menu 顶部菜单
# 每一项对应一个有 Word 文档的内容：主页（/，渲染 home 文档全文）由左上角站点标题承载；
# 菜单项只放有独立文档的页面/章节
menu:
  About: /about/

# flink picture will load if avator link calls on error
loading_bg:
  flink: /img/profile.png

# Social Links; 社交链接，不需要的链接直接注释掉
# 可以调整显示顺序
# 联系方式请编辑 source/about/index.md 的 Contact 部分，
# 侧边栏 Links 图标会从那里自动同步。
# 格式：- 名称: [显示文字](链接)，常见名称自动匹配图标（Email/GitHub/Scholar/ORCID/LinkedIn...）

# CV download link
cv_dl:
  enable: false
  dir: /attaches/CV.pdf
  description: My Detail CV.

# Box-shadow
# display box-shadow on page or not
box_shadow:
  enable: false

# CDN
# 根据需要自行添加js/css
# 自定义css可以直接写在user.styl中
CDN_USE:
  css:
    - /css/index.css
#    - https://cdn.jsdelivr.net/npm/font-awesome@latest/css/font-awesome.min.css
    - https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.13.0/css/all.min.css # fontawesome 5
  js:
    - https://cdn.jsdelivr.net/npm/jquery@latest/dist/jquery.min.js #/js/third-party/jquery.min.js
    - https://cdn.jsdelivr.net/npm/jquery-pjax@latest/jquery.pjax.min.js
    - /js/main.js